name: Release

# Stages a release on npm when a version tag (e.g. v3.0.0) is pushed, using npm
# trusted publishing (OIDC): no npm token is stored in this repository. The
# trusted publisher may only stage (`npm stage publish`): a maintainer approves
# the staged version with 2FA on npmjs.com (or `npm stage approve`) before it
# becomes public.
# One-time setup on npmjs.com: package settings -> Trusted publishing ->
# GitHub Actions, repository adaptiverecognition/js-carmen-cloud-client,
# workflow release.yml, environment npm.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - name: Check that the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --coverage=false
      # The bundled npm may predate `npm stage`.
      - run: npm install -g npm@11.16.0
      - run: npm stage publish --access public --provenance
