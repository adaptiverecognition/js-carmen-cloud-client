name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    env:
      TEST_DEV_API_KEY: ${{ secrets.API_TEST_EU_API_KEY_DEV }}
      TEST_EU_PROD_API_KEY: ${{ secrets.API_TEST_EU_API_KEY_PROD }}
      TEST_US_PROD_API_KEY: ${{ secrets.API_TEST_US_API_KEY_PROD }}
      TEST_DEV_ENDPOINT_URL: https://api.dev.carmencloud.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: npm run test:ci
      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: code-coverage-report
          path: coverage
