name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  # The live suites call the recognition APIs. The dev APIs only accept the
  # office LAN (WAF AR-EU-DEV-API-ACL), so GitHub-hosted runners can't reach
  # them: the live job runs on demand, against prod with the test-workspace
  # keys.
  workflow_dispatch:
    inputs:
      endpoint:
        description: API base URL for the live suites
        default: https://api.carmencloud.com

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      # No TEST_DEV_API_KEY here, so the live suites are skipped.
      - run: npm run test:ci
      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: code-coverage-report
          path: coverage

  live:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TEST_DEV_API_KEY: ${{ secrets.API_TEST_EU_API_KEY_PROD }}
      TEST_DEV_ENDPOINT_URL: ${{ inputs.endpoint }}
      TEST_EU_PROD_API_KEY: ${{ secrets.API_TEST_EU_API_KEY_PROD }}
      TEST_US_PROD_API_KEY: ${{ secrets.API_TEST_US_API_KEY_PROD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx jest --coverage=false --runInBand
